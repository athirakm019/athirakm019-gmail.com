<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" width="100%" height="100%">
  <defs>
    <!-- Platinum Gradients -->
    <linearGradient id="plt-rim" x1="15" y1="20" x2="185" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#e0f2fe"/>
      <stop offset="45%" stop-color="#94a3b8"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="90%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="plt-plate" x1="100" y1="20" x2="100" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="35%" stop-color="#cbd5e1"/>
      <stop offset="75%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="plt-inner" x1="100" y1="35" x2="100" y2="165" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#151e2e"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>
    <linearGradient id="plt-emblem" x1="60" y1="60" x2="140" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#e0f2fe"/>
      <stop offset="60%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="plt-cyan-glow" x1="70" y1="40" x2="130" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="plt-sheen" x1="30" y1="30" x2="170" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="plt-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#plt-shadow)">
    <!-- Aerodynamic Angular Platinum Outer Wing Crest -->
    <polygon points="100,12 172,36 186,96 160,158 100,186 40,158 14,96 28,36" 
             fill="url(#plt-rim)" stroke="#f8fafc" stroke-width="2"/>

    <!-- Layer 2: Precision Stepped Platinum Bevels -->
    <polygon points="100,22 162,44 174,96 150,148 100,172 50,148 26,96 38,44" 
             fill="url(#plt-plate)"/>

    <!-- Layer 3: Tech Facet Grooves -->
    <path d="M100 22 L100 36 M162 44 L150 56 M174 96 L158 96 M150 148 L138 136 M100 172 L100 156 M50 148 L62 136 M26 96 L42 96 M38 44 L50 56" 
          stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>

    <!-- Layer 4: Recessed Core Plate -->
    <polygon points="100,34 148,52 158,96 138,138 100,158 62,138 42,96 52,52" 
             fill="url(#plt-inner)" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Sheen overlay -->
    <polygon points="100,34 148,52 158,96 100,112 52,52" 
             fill="url(#plt-sheen)"/>

    <!-- Futuristic Cyan Accent Trim -->
    <polygon points="100,42 138,58 146,96 128,130 100,146 72,130 54,96 62,58" 
             stroke="url(#plt-cyan-glow)" stroke-width="1" stroke-dasharray="8 4" fill="none"/>

    <!-- Twin Diamond Emblems at Top Crest -->
    <polygon points="100,38 106,46 100,54 94,46" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="100" cy="46" r="1.5" fill="#ffffff"/>

    <!-- Lateral Precision Pins -->
    <circle cx="50" cy="96" r="2.5" fill="#38bdf8"/>
    <circle cx="150" cy="96" r="2.5" fill="#38bdf8"/>

    <!-- Platinum Geometric Central VE Monogram -->
    <path d="M70 76 L100 132 L130 76 H116 L100 106 L84 76 H70 Z" 
          fill="url(#plt-emblem)" stroke="#1e293b" stroke-width="1.5"/>
    <path d="M87 90 H113 M90 100 H110" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <path d="M96 95 H104" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>

    <!-- Futuristic Bottom Wing Chevron -->
    <path d="M72 144 L100 160 L128 144" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M80 152 L100 164 L120 152" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  </g>
</svg>
