<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" width="100%" height="100%">
  <defs>
    <!-- 24K Gold Gradients -->
    <linearGradient id="gld-rim" x1="20" y1="15" x2="180" y2="185" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="20%" stop-color="#fde047"/>
      <stop offset="45%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="90%" stop-color="#854d0e"/>
      <stop offset="100%" stop-color="#5a3307"/>
    </linearGradient>
    <linearGradient id="gld-plate" x1="100" y1="15" x2="100" y2="185" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#eab308"/>
      <stop offset="75%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="gld-inner" x1="100" y1="35" x2="100" y2="165" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2c1a05"/>
      <stop offset="50%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#180a02"/>
    </linearGradient>
    <linearGradient id="gld-emblem" x1="60" y1="60" x2="140" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="55%" stop-color="#f59e0b"/>
      <stop offset="85%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="gld-crown" x1="75" y1="20" x2="125" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="gld-sheen" x1="50" y1="30" x2="150" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="gld-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#78350f" flood-opacity="0.55"/>
    </filter>
  </defs>

  <g filter="url(#gld-glow)">
    <!-- Laurel Wreath Backdrop Accents -->
    <path d="M40 70 C34 95 38 126 56 148 C50 138 48 120 50 102 Z" fill="#ca8a04" opacity="0.85"/>
    <path d="M160 70 C166 95 162 126 144 148 C150 138 152 120 150 102 Z" fill="#ca8a04" opacity="0.85"/>
    <!-- Laurel Leaves -->
    <path d="M38 78 C30 84 32 94 42 90 C34 98 38 108 48 102 C42 112 48 120 58 116" stroke="#fde047" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M162 78 C170 84 168 94 158 90 C166 98 162 108 152 102 C158 112 152 120 142 116" stroke="#fde047" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Royal Arched Gold Shield Rim -->
    <path d="M100 24 C140 24 165 42 165 92 C165 132 136 166 100 182 C64 166 35 132 35 92 C35 42 60 24 100 24 Z" 
          fill="url(#gld-rim)" stroke="#fef08a" stroke-width="2"/>

    <!-- Stepped Gold Bevel Plate -->
    <path d="M100 32 C134 32 155 48 155 92 C155 126 130 156 100 170 C70 156 45 126 45 92 C45 48 66 32 100 32 Z" 
          fill="url(#gld-plate)"/>

    <!-- Inner Dark Obsidian Gold Well -->
    <path d="M100 42 C126 42 143 56 143 92 C143 120 122 146 100 158 C78 146 57 120 57 92 C57 56 74 42 100 42 Z" 
          fill="url(#gld-inner)" stroke="#ca8a04" stroke-width="1.5"/>

    <!-- Sheen overlay -->
    <path d="M100 42 C126 42 143 56 143 85 C115 75 85 85 57 95 C57 60 74 42 100 42 Z" 
          fill="url(#gld-sheen)"/>

    <!-- Gold Crown Header -->
    <path d="M84 40 L88 32 L94 36 L100 26 L106 36 L112 32 L116 40 H84 Z" 
          fill="url(#gld-crown)" stroke="#fffbeb" stroke-width="1"/>
    <circle cx="100" cy="27" r="2" fill="#fffbeb"/>
    <circle cx="88" cy="33" r="1.5" fill="#fef08a"/>
    <circle cx="112" cy="33" r="1.5" fill="#fef08a"/>

    <!-- Triple Star Constellation above VE -->
    <circle cx="85" cy="56" r="2" fill="#fef08a"/>
    <circle cx="115" cy="56" r="2" fill="#fef08a"/>
    <polygon points="100,50 102,55 107,55 103,58 105,63 100,60 95,63 97,58 93,55 98,55" fill="#fffbeb"/>

    <!-- Royal VE Monogram Emblem with Enhanced Depth -->
    <path d="M72 78 L100 134 L128 78 H114 L100 110 L86 78 H72 Z" 
          fill="url(#gld-emblem)" stroke="#78350f" stroke-width="1.5"/>
    <path d="M88 92 H112 M91 102 H109" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

    <!-- Bottom Golden Chevron & Starburst -->
    <path d="M76 146 L100 158 L124 146" stroke="#fde047" stroke-width="2" stroke-linecap="round" fill="none"/>
    <circle cx="100" cy="148" r="2.5" fill="#fffbeb"/>
  </g>
</svg>
