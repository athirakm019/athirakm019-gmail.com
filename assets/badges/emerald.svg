<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" width="100%" height="100%">
  <defs>
    <!-- Emerald & Gold Jewelry Gradients -->
    <linearGradient id="emr-gold-frame" x1="20" y1="20" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="75%" stop-color="#854d0e"/>
      <stop offset="100%" stop-color="#5a3307"/>
    </linearGradient>
    <linearGradient id="emr-gem-step1" x1="50" y1="30" x2="150" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="35%" stop-color="#059669"/>
      <stop offset="70%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="emr-gem-step2" x1="100" y1="45" x2="100" y2="155" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="40%" stop-color="#047857"/>
      <stop offset="85%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="emr-table" x1="70" y1="65" x2="130" y2="135" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="60%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#01140e"/>
    </linearGradient>
    <linearGradient id="emr-gold-ve" x1="70" y1="70" x2="130" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="65%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="emr-facet-sheen" x1="60" y1="40" x2="140" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="emr-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#022c22" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#emr-shadow)">
    <!-- Ornate Master Frame: Octagonal Jewel-Crest -->
    <polygon points="62,14 138,14 184,60 184,140 138,186 62,186 16,140 16,60" 
             fill="url(#emr-gold-frame)" stroke="#fef08a" stroke-width="2"/>

    <!-- High-Relief Jewelry Filigree Border -->
    <polygon points="66,22 134,22 176,64 176,136 134,178 66,178 24,136 24,64" 
             fill="#022c22" stroke="#ca8a04" stroke-width="1.5"/>

    <!-- Emerald Octagon Outer Step-Cut Facet (Pavilion / Crown) -->
    <polygon points="70,30 130,30 166,66 166,134 130,170 70,170 34,134 34,66" 
             fill="url(#emr-gem-step1)"/>

    <!-- Step-Cut Facet Trapezia Lines -->
    <polygon points="70,30 80,48 48,80 34,66" fill="#10b981" opacity="0.3"/>
    <polygon points="130,30 120,48 152,80 166,66" fill="#047857" opacity="0.4"/>
    <polygon points="166,134 152,120 120,152 130,170" fill="#022c22" opacity="0.6"/>
    <polygon points="34,134 48,120 80,152 70,170" fill="#059669" opacity="0.4"/>

    <!-- Emerald Middle Step-Cut Ring -->
    <polygon points="78,44 122,44 152,74 152,126 122,156 78,156 48,126 48,74" 
             fill="url(#emr-gem-step2)" stroke="#34d399" stroke-width="1"/>

    <!-- Emerald Inner Gem Table (Deep Obsidian Green Table) -->
    <polygon points="84,56 116,56 140,80 140,120 116,144 84,144 60,120 60,80" 
             fill="url(#emr-table)" stroke="#10b981" stroke-width="1.5"/>

    <!-- Specular Light Sheen Across Emerald Facets -->
    <path d="M78 44 L122 44 L152 74 L110 85 L60 80 L48 74 Z" 
          fill="url(#emr-facet-sheen)"/>

    <!-- 4 Sovereign Corner Gemstones / Gold Prongs -->
    <circle cx="28" cy="28" r="5" fill="#fde047" stroke="#854d0e" stroke-width="1"/>
    <circle cx="28" cy="28" r="2" fill="#ffffff"/>
    <circle cx="172" cy="28" r="5" fill="#fde047" stroke="#854d0e" stroke-width="1"/>
    <circle cx="172" cy="28" r="2" fill="#ffffff"/>
    <circle cx="28" cy="172" r="5" fill="#fde047" stroke="#854d0e" stroke-width="1"/>
    <circle cx="28" cy="172" r="2" fill="#ffffff"/>
    <circle cx="172" cy="172" r="5" fill="#fde047" stroke="#854d0e" stroke-width="1"/>
    <circle cx="172" cy="172" r="2" fill="#ffffff"/>

    <!-- Master Heraldic Star at Top -->
    <polygon points="100,24 102,30 108,30 103,34 105,40 100,36 95,40 97,34 92,30 98,30" fill="#fffbeb"/>

    <!-- Royal VE Emblem in Chiseled Gold Setting -->
    <path d="M72 78 L100 132 L128 78 H114 L100 106 L86 78 H72 Z" 
          fill="url(#emr-gold-ve)" stroke="#5a3307" stroke-width="1.25"/>
    <path d="M88 92 H112 M91 101 H109" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

    <!-- Subtle Internal Gemstone Reflection Lines -->
    <circle cx="100" cy="100" r="42" stroke="#34d399" stroke-width="0.75" stroke-dasharray="2 4" opacity="0.4"/>
  </g>
</svg>
