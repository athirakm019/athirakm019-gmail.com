<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" width="100%" height="100%">
  <defs>
    <!-- Silver Metal Gradients -->
    <linearGradient id="slv-rim" x1="20" y1="20" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="75%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="slv-plate" x1="100" y1="15" x2="100" y2="185" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="40%" stop-color="#94a3b8"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="slv-inner" x1="50" y1="50" x2="150" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="slv-emblem" x1="70" y1="65" x2="130" y2="135" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="slv-star" x1="85" y1="35" x2="115" y2="65" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="slv-sheen" x1="40" y1="40" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="slv-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#090d16" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#slv-shadow)">
    <!-- Outer Octagonal Ring -->
    <polygon points="100,14 158,38 182,96 158,154 100,178 42,154 18,96 42,38" 
             fill="url(#slv-rim)" stroke="#f1f5f9" stroke-width="2"/>

    <!-- Mid Plate with Beveled facets -->
    <polygon points="100,24 150,44 170,96 150,146 100,166 50,146 30,96 50,44" 
             fill="url(#slv-plate)"/>

    <!-- Inner Recessed Core -->
    <polygon points="100,34 142,50 158,96 142,138 100,154 58,138 42,96 58,50" 
             fill="url(#slv-inner)" stroke="#64748b" stroke-width="1.5"/>

    <!-- Sheen overlay -->
    <path d="M100 34 L142 50 L158 96 L100 110 L58 50 Z" 
          fill="url(#slv-sheen)"/>

    <!-- Geometric Accent Border Lines -->
    <polygon points="100,42 134,56 148,96 134,132 100,144 66,132 52,96 66,56" 
             stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 2" fill="none"/>

    <!-- Rising Star (4-point facet star at top) -->
    <path d="M100 38 L104 49 L115 53 L104 57 L100 68 L96 57 L85 53 L96 49 Z" 
          fill="url(#slv-star)" stroke="#ffffff" stroke-width="0.75"/>
    <circle cx="100" cy="53" r="1.5" fill="#ffffff"/>

    <!-- Twin Micro Stars on Lateral Wings -->
    <circle cx="64" cy="96" r="2" fill="#cbd5e1"/>
    <circle cx="136" cy="96" r="2" fill="#cbd5e1"/>

    <!-- Precision Central VE Monogram Emblem -->
    <path d="M76 80 L100 128 L124 80 H113 L100 108 L87 80 H76 Z" 
          fill="url(#slv-emblem)" stroke="#1e293b" stroke-width="1"/>
    <!-- Horizontal Tech Insets -->
    <path d="M91 94 H109 M93 103 H107" stroke="#ffffff" stroke-width="1.75" stroke-linecap="round"/>

    <!-- Lower Chevron Ribbon Accent -->
    <path d="M78 140 L100 150 L122 140" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M84 146 L100 154 L116 146" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  </g>
</svg>
