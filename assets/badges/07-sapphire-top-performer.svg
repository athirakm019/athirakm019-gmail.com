<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" width="100%" height="100%">
  <defs>
    <!-- Sapphire Gemstone & Rhodium Gradients -->
    <linearGradient id="sph-frame" x1="20" y1="10" x2="180" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="25%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="75%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="sph-gem-body" x1="100" y1="20" x2="100" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="30%" stop-color="#1d4ed8"/>
      <stop offset="65%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="sph-gem-table" x1="60" y1="60" x2="140" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>
    <linearGradient id="sph-emblem" x1="60" y1="60" x2="140" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#93c5fd"/>
      <stop offset="65%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="sph-gold-accent" x1="80" y1="20" x2="120" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
    <linearGradient id="sph-sheen" x1="40" y1="40" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="sph-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#172554" flood-opacity="0.7"/>
    </filter>
  </defs>

  <g filter="url(#sph-glow)">
    <!-- Aerodynamic Rhodium / Platinum Angel Wings -->
    <path d="M100 12 C148 12 184 34 190 82 C194 116 176 150 148 172 L100 190 L52 172 C24 150 6 116 10 82 C16 34 52 12 100 12 Z" 
          fill="url(#sph-frame)" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Gold Inlay Armor Accents -->
    <path d="M100 18 C142 18 174 38 180 80 C184 110 168 142 142 162 L100 180 L58 162 C32 142 16 110 20 80 C26 38 58 18 100 18 Z" 
          stroke="url(#sph-gold-accent)" stroke-width="1.5" fill="none"/>

    <!-- Cushion-Cut Royal Sapphire Cushion Bezel -->
    <rect x="42" y="38" width="116" height="116" rx="30" 
          fill="url(#sph-gem-body)" stroke="#60a5fa" stroke-width="2"/>

    <!-- Cushion-Cut Diagonal Facets -->
    <polygon points="42,68 70,70 70,42" fill="#3b82f6" opacity="0.35"/>
    <polygon points="158,68 130,70 130,42" fill="#1d4ed8" opacity="0.45"/>
    <polygon points="158,124 130,122 130,150" fill="#0f172a" opacity="0.6"/>
    <polygon points="42,124 70,122 70,150" fill="#1e3a8a" opacity="0.45"/>

    <!-- Inner Deep Sapphire Gem Table -->
    <rect x="62" y="58" width="76" height="76" rx="16" 
          fill="url(#sph-gem-table)" stroke="#2563eb" stroke-width="1.5"/>

    <!-- Prismatic Reflection Arc -->
    <path d="M48 58 C65 42 135 42 152 58 C135 70 65 70 48 58 Z" 
          fill="url(#sph-sheen)"/>

    <!-- Sapphire Starburst Top Finial -->
    <polygon points="100,24 103,32 111,32 105,38 107,46 100,41 93,46 95,38 89,32 97,32" 
             fill="#ffffff" stroke="#93c5fd" stroke-width="0.5"/>
    <circle cx="100" cy="35" r="1.5" fill="#1d4ed8"/>

    <!-- Dual Lateral Diamond Pointers -->
    <polygon points="32,96 38,91 44,96 38,101" fill="#e2e8f0"/>
    <polygon points="168,96 162,91 156,96 162,101" fill="#e2e8f0"/>

    <!-- Central Sapphire VE Monogram Emblem -->
    <path d="M72 76 L100 130 L128 76 H114 L100 105 L86 76 H72 Z" 
          fill="url(#sph-emblem)" stroke="#0f172a" stroke-width="1.25"/>
    <path d="M88 90 H112 M91 99 H109" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

    <!-- Bottom Sapphire Drop Pendant Accent -->
    <circle cx="100" cy="162" r="4.5" fill="#2563eb" stroke="#ffffff" stroke-width="1"/>
    <circle cx="100" cy="162" r="1.5" fill="#ffffff"/>
  </g>
</svg>
