<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none" width="100%" height="100%">
  <defs>
    <!-- Steel Base Gradient -->
    <linearGradient id="reactorSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <!-- Core Glow Gradient -->
    <radialGradient id="reactorCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#F2A900" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#F2A900" stop-opacity="0"/>
    </radialGradient>
    <!-- Gold Coin Gleam -->
    <linearGradient id="reactorGoldGleam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#fde047"/>
      <stop offset="60%" stop-color="#F2A900"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <!-- Machine Armor Housing -->
    <linearGradient id="machineHousing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A3042"/>
      <stop offset="50%" stop-color="#20263A"/>
      <stop offset="100%" stop-color="#161827"/>
    </linearGradient>
    <filter id="reactorShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#reactorShadow)">
    <!-- Reactor Pedestal Base Foundation -->
    <ellipse cx="200" cy="272" rx="125" ry="19" fill="url(#reactorSteel)" stroke="#38bdf8" stroke-width="1.5" opacity="0.85"/>
    <ellipse cx="200" cy="272" rx="75" ry="10" fill="#38bdf8" opacity="0.25"/>

    <!-- Left Energy Conduits / Mining Activity Cables -->
    <path d="M100 272 C70 250 55 205 65 165 C72 135 95 125 120 135" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.7"/>
    <!-- Right Collector Conduit toward Machine Body -->
    <path d="M295 272 C325 250 340 210 330 170 C325 145 300 130 280 135" stroke="#F2A900" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.7"/>

    <!-- Outer Magnetic Confinement Ring -->
    <g>
      <circle cx="185" cy="145" r="82" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="32 14" opacity="0.6"/>
      <circle cx="185" cy="145" r="88" stroke="#60a5fa" stroke-width="1" stroke-dasharray="12 36" opacity="0.4"/>
      <!-- Ring Node Magnets -->
      <circle cx="185" cy="63" r="4" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="185" cy="227" r="4" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="103" cy="145" r="4" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="267" cy="145" r="4" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5"/>
    </g>

    <!-- Inner Magnetic Confinement Ring -->
    <g>
      <circle cx="185" cy="145" r="62" stroke="#F2A900" stroke-width="2" stroke-dasharray="24 18" opacity="0.8"/>
      <polygon points="185,83 189,91 181,91" fill="#fde047"/>
      <polygon points="185,207 189,199 181,199" fill="#fde047"/>
    </g>

    <!-- Central Quantum Energy Core Glow -->
    <circle cx="185" cy="145" r="46" fill="url(#reactorCoreGlow)"/>

    <!-- MAIN LEVITATING VE COIN -->
    <g>
      <!-- Coin Outer Rim & 3D bevel -->
      <circle cx="185" cy="143" r="34" fill="url(#reactorGoldGleam)" stroke="#fffbeb" stroke-width="2.5"/>
      <circle cx="185" cy="143" r="28" fill="#1e1808" stroke="#d97706" stroke-width="1.5"/>
      <!-- Holographic VE Monogram inside main coin -->
      <path d="M172 131 L185 157 L198 131 H191 L185 143 L179 131 H172 Z" fill="#fef08a"/>
      <path d="M181 139 H193 M182 144 H190" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Shimmer flare on coin -->
      <circle cx="173" cy="131" r="3" fill="#ffffff"/>
    </g>

    <!-- SMALLER ORBITING VE COINS -->
    <!-- Smaller Coin 1: Top-Left Orbit -->
    <g transform="translate(132, 92)">
      <circle cx="0" cy="0" r="10" fill="url(#reactorGoldGleam)" stroke="#ffffff" stroke-width="1"/>
      <circle cx="0" cy="0" r="8" fill="#2a1f0a"/>
      <text x="-5" y="3" fill="#fef08a" font-family="Inter, sans-serif" font-size="6" font-weight="bold">VE</text>
    </g>
    <!-- Smaller Coin 2: Mid-Trajectory -->
    <g transform="translate(236, 172)">
      <circle cx="0" cy="0" r="8" fill="url(#reactorGoldGleam)" stroke="#ffffff" stroke-width="1"/>
      <circle cx="0" cy="0" r="6.5" fill="#2a1f0a"/>
      <text x="-4" y="2.5" fill="#fef08a" font-family="Inter, sans-serif" font-size="5" font-weight="bold">VE</text>
    </g>
    <!-- Smaller Coin 3: Entering Receptacle Conduit -->
    <g transform="translate(262, 196)">
      <circle cx="0" cy="0" r="7" fill="url(#reactorGoldGleam)" stroke="#ffffff" stroke-width="0.75"/>
      <circle cx="0" cy="0" r="5.5" fill="#2a1f0a"/>
      <text x="-3.5" y="2" fill="#fef08a" font-family="Inter, sans-serif" font-size="4" font-weight="bold">VE</text>
    </g>

    <!-- Stream of Quantum VE Emission Energy toward Machine Body -->
    <path d="M215 152 Q245 170 272 198" stroke="#F2A900" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
    <circle cx="230" cy="164" r="2.5" fill="#ffffff"/>
    <circle cx="250" cy="180" r="2" fill="#fde047"/>

    <!-- FUTURISTIC MINING MACHINE BODY & SCREEN (Right Section) -->
    <g id="miningMachineUnit" transform="translate(272, 170)">
      <!-- Machine Armor Body -->
      <path d="M0 12 L12 0 H106 L118 12 V82 L106 94 H12 L0 82 Z" fill="url(#machineHousing)" stroke="#F2A900" stroke-width="2"/>
      <!-- Machine Top Cooling Grill -->
      <line x1="24" y1="6" x2="94" y2="6" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
      
      <!-- High-Tech Machine Screen (HUD) -->
      <rect x="10" y="14" width="98" height="66" rx="6" fill="#0c101c" stroke="#38bdf8" stroke-width="1.5"/>
      
      <!-- Machine Display: +38 VE (Required) -->
      <text x="18" y="34" fill="#9AA4B8" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold" letter-spacing="0.5">REWARD YIELD</text>
      <text x="18" y="52" fill="#F2A900" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold">+38 VE</text>

      <!-- Machine Status: ● MINING ACTIVE (Required) -->
      <g transform="translate(18, 62)">
        <circle cx="4" cy="4" r="3.5" fill="#10b981"/>
        <circle cx="4" cy="4" r="1.5" fill="#ffffff"/>
        <text x="12" y="7" fill="#F5F5F5" font-family="Inter, sans-serif" font-size="7.5" font-weight="bold" letter-spacing="0.4">MINING ACTIVE</text>
      </g>

      <!-- Machine Vent Accents -->
      <line x1="20" y1="88" x2="35" y2="88" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="42" y1="88" x2="57" y2="88" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="64" y1="88" x2="79" y2="88" stroke="#F2A900" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="86" y1="88" x2="100" y2="88" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
