<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" width="100%" height="100%">
  <defs>
    <!-- Diamond Crystal Gradients -->
    <linearGradient id="dmd-crown" x1="100" y1="12" x2="100" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="dmd-facet-l1" x1="20" y1="60" x2="100" y2="188" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="50%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="dmd-facet-r1" x1="180" y1="60" x2="100" y2="188" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="80%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="dmd-facet-c" x1="100" y1="60" x2="100" y2="188" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e0f2fe"/>
      <stop offset="80%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="dmd-table" x1="60" y1="60" x2="140" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c2038"/>
      <stop offset="50%" stop-color="#071728"/>
      <stop offset="100%" stop-color="#030b14"/>
    </linearGradient>
    <linearGradient id="dmd-emblem" x1="60" y1="60" x2="140" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#f0f9ff"/>
      <stop offset="60%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="dmd-sparkle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0"/>
    </linearGradient>
    <filter id="dmd-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0284c7" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#dmd-glow)">
    <!-- Brilliant Cut Outer Diamond Frame -->
    <!-- Top Table Facets -->
    <polygon points="60,20 140,20 176,56 100,56" fill="#f0f9ff" stroke="#ffffff" stroke-width="1.5"/>
    <polygon points="60,20 100,56 24,56" fill="#bae6fd" stroke="#ffffff" stroke-width="1.5"/>
    <polygon points="60,20 100,12 140,20" fill="#ffffff" stroke="#e0f2fe" stroke-width="1.5"/>

    <!-- Lower Pavilion Facets -->
    <polygon points="24,56 60,105 100,188 24,56" fill="url(#dmd-facet-l1)" stroke="#e0f2fe" stroke-width="1"/>
    <polygon points="176,56 140,105 100,188 176,56" fill="url(#dmd-facet-r1)" stroke="#7dd3fc" stroke-width="1"/>
    <polygon points="60,105 100,56 140,105 100,188 60,105" fill="url(#dmd-facet-c)" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Outer Protective Platinum Rim Clips -->
    <path d="M18,52 L26,58 L20,70" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M182,52 L174,58 L180,70" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M92,192 L100,186 L108,192" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M92,10 L100,14 L108,10" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Diamond Center Gem Recess & Prism Table -->
    <polygon points="100,58 138,94 100,140 62,94" fill="url(#dmd-table)" stroke="#38bdf8" stroke-width="2"/>

    <!-- Prismatic Reflection Bevels inside Table -->
    <polygon points="100,66 128,94 100,130 72,94" stroke="#7dd3fc" stroke-width="1" stroke-dasharray="4 2" fill="none"/>

    <!-- Brilliant Light Refraction Rays -->
    <line x1="100" y1="58" x2="100" y2="140" stroke="#e0f2fe" stroke-width="1" opacity="0.4"/>
    <line x1="62" y1="94" x2="138" y2="94" stroke="#e0f2fe" stroke-width="1" opacity="0.4"/>

    <!-- Center VE Emblem with Diamond Prismatic Sheen -->
    <path d="M74 80 L100 126 L126 80 H114 L100 106 L86 80 H74 Z" 
          fill="url(#dmd-emblem)" stroke="#0c4a6e" stroke-width="1.25"/>
    <path d="M89 92 H111 M92 100 H108" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

    <!-- Crystal Prismatic Star Accents (Faceted Flares) -->
    <!-- Primary Flare Top Left -->
    <path d="M52 46 L55 52 L61 55 L55 58 L52 64 L49 58 L43 55 L49 52 Z" fill="#ffffff"/>
    <circle cx="52" cy="55" r="1" fill="#7dd3fc"/>
    <!-- Secondary Flare Top Right -->
    <path d="M148 46 L151 52 L157 55 L151 58 L148 64 L145 58 L139 55 L145 52 Z" fill="#ffffff"/>
    <circle cx="148" cy="55" r="1" fill="#7dd3fc"/>

    <!-- Pavé Diamond Baseline Accent -->
    <circle cx="88" cy="148" r="2" fill="#ffffff"/>
    <circle cx="100" cy="154" r="2.5" fill="#ffffff"/>
    <circle cx="112" cy="148" r="2" fill="#ffffff"/>
  </g>
</svg>
