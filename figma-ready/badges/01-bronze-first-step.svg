<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" width="100%" height="100%">
  <defs>
    <!-- Bronze Gradients -->
    <linearGradient id="brz-plate" x1="20" y1="20" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#bf7d4e"/>
      <stop offset="35%" stop-color="#8c502b"/>
      <stop offset="70%" stop-color="#593016"/>
      <stop offset="100%" stop-color="#3b1d0a"/>
    </linearGradient>
    <linearGradient id="brz-rim" x1="100" y1="15" x2="100" y2="185" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e8a87c"/>
      <stop offset="25%" stop-color="#b56f42"/>
      <stop offset="75%" stop-color="#6e3717"/>
      <stop offset="100%" stop-color="#3d1c08"/>
    </linearGradient>
    <linearGradient id="brz-inner" x1="100" y1="35" x2="100" y2="165" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2a1408"/>
      <stop offset="50%" stop-color="#4a2612"/>
      <stop offset="100%" stop-color="#1e0c04"/>
    </linearGradient>
    <linearGradient id="brz-emblem" x1="70" y1="65" x2="130" y2="135" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f5caa6"/>
      <stop offset="40%" stop-color="#c98251"/>
      <stop offset="80%" stop-color="#8a4d25"/>
      <stop offset="100%" stop-color="#54290e"/>
    </linearGradient>
    <linearGradient id="brz-sheen" x1="60" y1="25" x2="140" y2="175" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="brz-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0b0806" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Shield Shadow -->
  <g filter="url(#brz-shadow)">
    <!-- Base Outer Shield Rim -->
    <path d="M100 16 L164 42 V106 C164 142 136 172 100 184 C64 172 36 142 36 106 V42 L100 16 Z" 
          fill="url(#brz-rim)" stroke="#d99365" stroke-width="2"/>

    <!-- Outer Bevel Plate -->
    <path d="M100 24 L156 47 V104 C156 136 132 163 100 174 C68 163 44 136 44 104 V47 L100 24 Z" 
          fill="url(#brz-plate)"/>

    <!-- Inner Recessed Field -->
    <path d="M100 34 L146 54 V102 C146 128 126 151 100 160 C74 151 54 128 54 102 V54 L100 34 Z" 
          fill="url(#brz-inner)" stroke="#6e3717" stroke-width="1.5"/>

    <!-- Light Sheen Arc -->
    <path d="M100 35 L145 54 V85 C125 75 100 80 75 92 V45 L100 35 Z" 
          fill="url(#brz-sheen)"/>

    <!-- Corner Rivets / Studs -->
    <circle cx="56" cy="56" r="3" fill="#e8a87c" stroke="#3d1c08" stroke-width="1"/>
    <circle cx="144" cy="56" r="3" fill="#e8a87c" stroke="#3d1c08" stroke-width="1"/>
    <circle cx="100" cy="168" r="3" fill="#e8a87c" stroke="#3d1c08" stroke-width="1"/>

    <!-- Beginner Chevron Base -->
    <path d="M80 142 L100 152 L120 142" stroke="#b56f42" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Central VE Monogram Emblem -->
    <!-- V Shape -->
    <path d="M78 76 L100 120 L122 76 H112 L100 102 L88 76 H78 Z" 
          fill="url(#brz-emblem)" stroke="#2b1408" stroke-width="1"/>
    <!-- E Shape Bar Accents inside -->
    <path d="M92 90 H108 M94 98 H106" stroke="#f5caa6" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Small Star of Initiation -->
    <path d="M100 50 L102 55 L107 55 L103 58 L105 63 L100 60 L95 63 L97 58 L93 55 L98 55 Z" 
          fill="#f5caa6"/>
  </g>
</svg>
