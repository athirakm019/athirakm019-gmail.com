<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" width="100%" height="100%">
  <defs>
    <!-- Deep Pigeon-Blood Ruby & Sovereign Dark Gold Gradients -->
    <linearGradient id="rby-frame" x1="20" y1="10" x2="180" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="20%" stop-color="#fde047"/>
      <stop offset="45%" stop-color="#b45309"/>
      <stop offset="70%" stop-color="#4c0519"/>
      <stop offset="90%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="rby-gem-outer" x1="100" y1="25" x2="100" y2="175" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="35%" stop-color="#be123c"/>
      <stop offset="70%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </linearGradient>
    <linearGradient id="rby-gem-table" x1="70" y1="60" x2="130" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="50%" stop-color="#4c0519"/>
      <stop offset="100%" stop-color="#1f020a"/>
    </linearGradient>
    <linearGradient id="rby-emblem" x1="65" y1="65" x2="135" y2="135" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fecdd3"/>
      <stop offset="60%" stop-color="#fb7185"/>
      <stop offset="85%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="rby-sheen" x1="40" y1="35" x2="160" y2="165" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="rby-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#4c0519" flood-opacity="0.75"/>
    </filter>
  </defs>

  <g filter="url(#rby-glow)">
    <!-- Ornate Sovereign Shield with Jagged Crest & Dragon Wings -->
    <path d="M100 14 L154 28 L182 58 L180 114 L152 162 L100 186 L48 162 L20 114 L18 58 L46 28 Z" 
          fill="url(#rby-frame)" stroke="#fde047" stroke-width="2"/>

    <!-- Ruthenium / Dark Metal Underplate -->
    <path d="M100 24 L146 36 L170 62 L168 110 L144 152 L100 174 L56 152 L32 110 L30 62 L54 36 Z" 
          fill="#18040b" stroke="#881337" stroke-width="1.5"/>

    <!-- Shield-Cut Faceted Ruby Gemstone Body -->
    <path d="M100 32 L140 44 L160 68 L158 108 L136 144 L100 164 L64 144 L42 108 L40 68 L60 44 Z" 
          fill="url(#rby-gem-outer)" stroke="#fb7185" stroke-width="1.5"/>

    <!-- Ruby Triangular / Geometric Facet Network -->
    <!-- Top facets -->
    <polygon points="100,32 100,64 60,44" fill="#fb7185" opacity="0.3"/>
    <polygon points="100,32 140,44 100,64" fill="#e11d48" opacity="0.4"/>
    <!-- Lateral facets -->
    <polygon points="40,68 68,90 60,44" fill="#be123c" opacity="0.45"/>
    <polygon points="160,68 140,44 132,90" fill="#881337" opacity="0.5"/>
    <!-- Lower facets -->
    <polygon points="42,108 68,90 64,144" fill="#4c0519" opacity="0.6"/>
    <polygon points="158,108 136,144 132,90" fill="#4c0519" opacity="0.7"/>

    <!-- Deep Ruby Table Core -->
    <polygon points="100,60 132,86 120,126 80,126 68,86" 
             fill="url(#rby-gem-table)" stroke="#e11d48" stroke-width="1.5"/>

    <!-- Specular Light Sheen Overlay -->
    <path d="M100 32 L140 44 L160 68 L110 85 L60 80 L40 68 L60 44 Z" 
          fill="url(#rby-sheen)"/>

    <!-- Sovereign Diamond Studs on Crown Points -->
    <circle cx="100" cy="24" r="3" fill="#ffffff" stroke="#e11d48" stroke-width="1"/>
    <circle cx="50" cy="34" r="2.5" fill="#fde047"/>
    <circle cx="150" cy="34" r="2.5" fill="#fde047"/>

    <!-- Elite Tier Crown Motif -->
    <path d="M86 44 L90 36 L96 40 L100 32 L104 40 L110 36 L114 44 H86 Z" 
          fill="#fde047" stroke="#92400e" stroke-width="0.75"/>

    <!-- Central Ruby VE Monogram Emblem with Crimson Radiance -->
    <path d="M72 74 L100 128 L128 74 H114 L100 104 L86 74 H72 Z" 
          fill="url(#rby-emblem)" stroke="#4c0519" stroke-width="1.5"/>
    <path d="M88 88 H112 M91 97 H109" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

    <!-- Bottom Ruby Teardrop Finial -->
    <path d="M100 166 L104 174 C104 176 102 178 100 178 C98 178 96 176 96 174 Z" 
          fill="#e11d48" stroke="#ffffff" stroke-width="0.75"/>
  </g>
</svg>
